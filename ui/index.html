<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zigboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; }
        #search-bar { padding: 1rem; background: #252526; border-bottom: 1px solid #3e3e42; }
        #search-input { width: 100%; padding: 0.5rem; background: #3c3c3c; border: 1px solid #3e3e42; color: #d4d4d4; font-size: 1rem; outline: none; }
        #search-input:focus { border-color: #007acc; }
        #history-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .group-header { font-size: 0.75rem; font-weight: 600; color: #007acc; text-transform: uppercase; padding: 1rem 0.75rem 0.5rem; letter-spacing: 0.5px; }
        .history-item { background: #252526; border: 1px solid #3e3e42; padding: 0.75rem; margin-bottom: 0.5rem; cursor: pointer; transition: background 0.1s; }
        .history-item:hover, .history-item.selected { background: #2a2d2e; border-color: #007acc; }
        .history-item.pinned { border-left: 3px solid #007acc; }
        .item-text { white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; }
        .item-meta { font-size: 0.75rem; color: #858585; margin-top: 0.5rem; }
        #status-bar { padding: 0.5rem 1rem; background: #007acc; color: white; font-size: 0.85rem; text-align: center; }
        #keyboard-help { position: fixed; bottom: 3rem; right: 1rem; background: #252526; border: 1px solid #3e3e42; padding: 1rem; font-size: 0.75rem; opacity: 0.7; }
        .kbd { background: #3c3c3c; padding: 0.2rem 0.4rem; border-radius: 3px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="search-bar"><input type="text" id="search-input" placeholder="Search... (Ctrl+F)" autofocus></div>
    <div id="history-list"></div>
    <div id="status-bar">Ready</div>
    <div id="keyboard-help">
        <div><span class="kbd">↑/↓</span> Navigate</div>
        <div><span class="kbd">Enter</span> Copy</div>
        <div><span class="kbd">Ctrl+P</span> Pin/Unpin</div>
        <div><span class="kbd">Del</span> Delete</div>
        <div><span class="kbd">Esc</span> Close</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
