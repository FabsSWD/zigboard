name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2
      
      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: ${{ runner.os }}-zig-bench-${{ hashFiles('build.zig', 'build.zig.zon') }}
      
      - name: Run benchmarks
        run: |
          zig build bench 2>&1 | tee output.txt

      - name: Upload benchmark output
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-output
          path: output.txt